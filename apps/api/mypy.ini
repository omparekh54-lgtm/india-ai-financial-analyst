# Incremental mypy baseline for integration-heavy modules that predate the CI typecheck gate.
#
# The API remains typechecked as a whole. These overrides are deliberately module- and
# error-code-scoped so newly introduced errors elsewhere still fail CI. Do not add new
# modules here as a shortcut; remove entries as each dynamic boundary is made fully typed.

[mypy]
ignore_missing_imports = True
explicit_package_bases = True
show_error_codes = True
warn_unused_configs = True

[mypy-app.research.context_enrichment]
disable_error_code = arg-type,operator

[mypy-app.repositories.official_feeds]
disable_error_code = call-overload

[mypy-app.brokers.repository]
disable_error_code = return-value,arg-type

[mypy-app.research.context]
disable_error_code = arg-type

[mypy-app.connectors.india_official]
disable_error_code = arg-type

[mypy-app.ingestion.xbrl_financials]
disable_error_code = arg-type

[mypy-app.market.upstox]
disable_error_code = union-attr,arg-type

[mypy-app.research.acquisition]
disable_error_code = call-overload

[mypy-app.market.live_overlay]
disable_error_code = attr-defined,arg-type

[mypy-app.workers.official_feeds]
disable_error_code = call-overload

[mypy-app.market.upstox_stream]
disable_error_code = arg-type

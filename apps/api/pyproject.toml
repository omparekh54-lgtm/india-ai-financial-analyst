[project]
name = "india-ai-financial-analyst-api"
version = "0.1.0"
description = "FastAPI backend for the India-first multimodal multi-agent equity research platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "websockets>=15,<16",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "orjson>=3.10,<4",
  "tenacity>=9,<10",
  "pandas>=2.3,<3",
  "numpy>=2.2,<3",
  "scipy>=1.16,<2",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.7,<2",
  "polars>=1.32,<2",
  "duckdb>=1.3,<2",
  "beautifulsoup4>=4.13,<5",
  "lxml>=6,<7",
  "feedparser>=6,<7",
  "rapidfuzz>=3.13,<4",
  "pymupdf>=1.26,<2",
  "sentence-transformers>=5,<6",
  "sentry-sdk[fastapi]>=2.35,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

target-version = "py311"

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: production
    ports:
      - "8000:8000"
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  research-worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: production
    command: ["python", "scripts/run_research_worker.py"]
    init: true
    stop_grace_period: 45s
    healthcheck:
      disable: true
    restart: unless-stopped

  official-feed-worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: production
    command: ["python", "scripts/run_official_feed_daemon.py"]
    init: true
    stop_grace_period: 45s
    healthcheck:
      disable: true
    restart: unless-stopped

  live-market-worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: production
    command: ["python", "scripts/run_live_market_worker.py"]
    init: true
    stop_grace_period: 45s
    healthcheck:
      disable: true
    restart: unless-stopped

  research-calibration:
    profiles: ["maintenance"]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: production
    command: ["python", "scripts/run_research_calibration.py", "--limit", "500"]
    init: true
    restart: "no"

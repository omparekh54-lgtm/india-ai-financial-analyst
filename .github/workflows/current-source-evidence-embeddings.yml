name: Current-source evidence embeddings

on:
  workflow_run:
    workflows: [Current-source NIFTY 50 data collection]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-tier-production-data
  cancel-in-progress: false

jobs:
  embeddings:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_ENV: production
      FREE_ONLY: "true"
      ENABLE_EXTERNAL_LLM_CALLS: "false"
      ENABLE_SEMANTIC_RETRIEVAL: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Require existing database secret
        run: test -n "${DATABASE_URL:-}"
      - name: Install the existing local embedding runtime on CPU
        run: |
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[embeddings]"
      - name: Populate missing embeddings from existing filing evidence
        run: |
          set -o pipefail
          python scripts/backfill_evidence_embeddings.py --batch-size 64 --limit 10000 \
            | tee embedding-results.jsonl
      - name: Save compact embedding results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-embeddings-${{ github.run_id }}
          path: apps/api/embedding-results.jsonl
          if-no-files-found: warn
          retention-days: 1

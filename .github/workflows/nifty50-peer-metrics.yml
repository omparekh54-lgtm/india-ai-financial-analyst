name: NIFTY 50 peer metrics

on:
  push:
    branches: [main]
    paths:
      - .github/run-markers/nifty50-peer-metrics

permissions:
  contents: read

concurrency:
  group: free-tier-production-data
  cancel-in-progress: false

jobs:
  first-financial-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      APP_ENV: production
      FREE_ONLY: "true"
      ENABLE_EXTERNAL_DATA_CALLS: "true"
      ENABLE_EXTERNAL_LLM_CALLS: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Require database secret and reviewed batch marker
        run: |
          test -n "${DATABASE_URL:-}"
          grep -Fxq 'batch: first-16-nifty50' ../../.github/run-markers/nifty50-peer-metrics
      - name: Install metric runtime
        run: pip install -e .
      - name: Derive metrics from sourced financial and market inputs
        run: >-
          python scripts/backfill_derived_security_metrics.py
          --nifty50 --refresh-all --limit 16 --min-metrics 3

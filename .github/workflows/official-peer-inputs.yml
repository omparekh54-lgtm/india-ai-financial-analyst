name: Official prepared-universe peer inputs

on:
  push:
    branches: [main]
    paths: [.github/run-markers/official-peer-inputs]

permissions:
  contents: read

concurrency:
  group: free-tier-production-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_ENV: production
      FREE_ONLY: "true"
      ENABLE_EXTERNAL_DATA_CALLS: "true"
      ENABLE_EXTERNAL_LLM_CALLS: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Validate reviewed one-time authorization
        run: |
          test -n "${DATABASE_URL:-}"
          grep -Fxq 'scope: prepared-50-official-peer-inputs' ../../.github/run-markers/official-peer-inputs
          mkdir -p peer-results
      - name: Install existing API runtime
        run: pip install -e .
      - name: Collect one completed official EOD session
        id: eod
        continue-on-error: true
        run: |
          set -euo pipefail
          session=$(sed -n 's/^session: //p' ../../.github/run-markers/official-peer-inputs)
          python scripts/collect_official_peer_inputs.py --session "$session" --dry-run \
            | tee peer-results/eod-validation.jsonl
          python scripts/collect_official_peer_inputs.py --session "$session" --skip-readiness-refresh \
            | tee peer-results/eod-import.jsonl
      - name: Check official classification access before a bounded batch
        id: classification
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY' | tee peer-results/classification.jsonl
          import asyncio, subprocess, sys
          from sqlalchemy import text
          from app.core.config import get_settings
          from app.db import create_database_engine
          async def targets():
              engine = create_database_engine(get_settings().database_url)
              try:
                  async with engine.connect() as connection:
                      return list((await connection.execute(text("select nse_symbol from securities where id in (select distinct security_id from security_agent_readiness_status) order by nse_symbol"))).scalars())
              finally:
                  await engine.dispose()
          symbols = asyncio.run(targets())
          if not 1 <= len(symbols) <= 50 or not all(symbols):
              raise RuntimeError("Prepared-universe classification guard failed")
          command = [sys.executable, "scripts/backfill_nse_industry_classification.py"]
          probe = "RELIANCE" if "RELIANCE" in symbols else symbols[0]
          subprocess.run(command + ["--security", probe, "--apply", "--limit", "1"], check=True, timeout=120)
          arguments = [item for symbol in symbols for item in ("--security", symbol)]
          subprocess.run(command + arguments + ["--apply", "--limit", "50", "--delay-ms", "500"], check=True, timeout=900)
          PY
      - name: Save compact collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-peer-inputs-${{ github.run_id }}
          path: apps/api/peer-results/
          retention-days: 1
          if-no-files-found: warn
      - name: Report incomplete collection visibly
        if: always()
        env:
          EOD_OUTCOME: ${{ steps.eod.outcome }}
          CLASSIFICATION_OUTCOME: ${{ steps.classification.outcome }}
        run: |
          python - <<'PY'
          import json, os
          outcomes = {key: os.environ[key] for key in ("EOD_OUTCOME", "CLASSIFICATION_OUTCOME")}
          print(json.dumps(outcomes))
          raise SystemExit(any(value != "success" for value in outcomes.values()))
          PY

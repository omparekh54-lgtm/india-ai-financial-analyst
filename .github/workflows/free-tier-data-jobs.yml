name: Free-tier data jobs

on:
  push:
    branches: [main]
    paths:
      - .github/run-markers/nifty50-financials
  schedule:
    # 18:15 India time on weekdays. GitHub may start scheduled jobs a little late.
    - cron: "45 12 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: Data job to run
        required: true
        default: market-and-benchmarks
        type: choice
        options:
          - market-and-benchmarks
          - classification
          - financials
          - peer-metrics
          - nifty50-classification
          - nifty50-financials
          - nifty50-peer-metrics
      financial_batches:
        description: Financial batches of 25 securities (maximum 8 per run)
        required: false
        default: "4"
        type: string
      financial_start_after:
        description: >-
          Financials/NIFTY 50: resume after this NSE symbol instead of restarting from the
          beginning of the alphabet (optional). Use the "next_after_symbol" value printed in
          the previous failed/partial run's JSON output, e.g. ABCOTS.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: free-tier-production-data
  cancel-in-progress: false

env:
  APP_ENV: production
  FREE_ONLY: "true"
  ENABLE_EXTERNAL_DATA_CALLS: "true"
  ENABLE_EXTERNAL_LLM_CALLS: "false"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  market:
    if: github.event_name == 'schedule' || inputs.job == 'market-and-benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Require database secret
        run: test -n "${DATABASE_URL:-}"
      - name: Install market job runtime
        run: pip install -e ".[market_imports]"
      - name: Refresh supported NSE end-of-day history
        run: >-
          python scripts/backfill_yfinance_market_history.py
          --all --from-listing --daily-refresh --supported-only
          --recent-history-days 400 --interval 1d --limit 10000
          --request-delay-seconds 0.5 --confirm-yahoo-research-use
      - name: Refresh official NSE benchmarks
        run: python scripts/backfill_nse_benchmarks.py --min-rows 2
      - name: Sync sourced India VIX benchmark into macro context
        run: python scripts/sync_india_vix_macro.py --max-age-days 7

  classification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.job == 'classification' || inputs.job == 'nifty50-classification')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Require database secret
        run: test -n "${DATABASE_URL:-}"
      - name: Install classification runtime
        run: pip install -e .
      - name: Backfill sectoral classifications (Total Market Index bulk file)
        if: inputs.job == 'classification'
        run: >-
          python scripts/backfill_nse_sectoral_classification.py
          --apply --min-match-pct 20
      - name: Backfill official four-tier classifications (NIFTY 50 first)
        if: inputs.job == 'nifty50-classification'
        run: >-
          python scripts/backfill_nse_industry_classification.py
          --nifty50 --apply --limit 50 --delay-ms 500 --min-coverage-pct 90

  financials:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.job == 'financials' || inputs.job == 'nifty50-financials'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Validate bounded batch count
        if: inputs.job == 'financials'
        env:
          BATCHES: ${{ inputs.financial_batches }}
        run: |
          [[ "$BATCHES" =~ ^[1-8]$ ]] || { echo "financial_batches must be 1-8"; exit 2; }
          test -n "${DATABASE_URL:-}"
      - name: Install financial job runtime
        run: pip install -e .
      - name: Backfill a resumable financial batch
        if: inputs.job == 'financials'
        env:
          BATCHES: ${{ inputs.financial_batches }}
          START_AFTER: ${{ inputs.financial_start_after }}
        run: |
          ARGS=(--batch-size 25 --max-batches "$BATCHES" --max-periods 10 \
                --request-delay-seconds 0.5 --document-delay-seconds 0.2)
          if [[ -n "$START_AFTER" ]]; then
            ARGS+=(--start-after-symbol "$START_AFTER")
          fi
          python scripts/bootstrap_nse_financial_results_all.py "${ARGS[@]}"
      - name: Backfill incomplete NIFTY 50 financial evidence
        if: github.event_name == 'push' || inputs.job == 'nifty50-financials'
        env:
          EVENT_NAME: ${{ github.event_name }}
          START_AFTER: ${{ inputs.financial_start_after }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            START_AFTER=$(sed -n 's/^after-symbol: //p' ../../.github/run-markers/nifty50-financials)
            if [[ -z "$START_AFTER" ]]; then
              echo "NIFTY 50 push marker requires an after-symbol checkpoint"
              exit 2
            fi
          fi
          SYMBOL_PATTERN='^[A-Z0-9&-]{1,30}$'
          if [[ -n "$START_AFTER" && ! "$START_AFTER" =~ $SYMBOL_PATTERN ]]; then
            echo "financial_start_after must be an uppercase NSE symbol"
            exit 2
          fi
          ARGS=(--nifty50 --limit 8 --max-periods 10
                --request-delay-seconds 0.5 --document-delay-seconds 0.2)
          if [[ -n "$START_AFTER" ]]; then
            ARGS+=(--after-symbol "$START_AFTER")
          fi
          python scripts/backfill_nse_financial_results.py "${ARGS[@]}"

  peer-metrics:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.job == 'peer-metrics' || inputs.job == 'nifty50-peer-metrics')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Require database secret
        run: test -n "${DATABASE_URL:-}"
      - name: Install metric runtime
        run: pip install -e .
      - name: Derive auditable peer metrics
        if: inputs.job == 'peer-metrics'
        run: >-
          python scripts/bootstrap_derived_security_metrics_all.py
          --batch-size 100 --max-batches 8 --min-coverage-pct 25
      - name: Derive auditable NIFTY 50 peer metrics
        if: inputs.job == 'nifty50-peer-metrics'
        run: >-
          python scripts/backfill_derived_security_metrics.py
          --nifty50 --limit 50 --min-metrics 3

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API + live market worker runtime
        run: pip install -e ".[dev,live_market]"
      - name: Ruff
        run: ruff check app tests scripts
      - name: Typecheck
        run: mypy app --ignore-missing-imports --explicit-package-bases
      - name: Tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: |
          touch .env
          docker compose -f deploy/docker-compose.production.yml config >/dev/null
      - name: Validate API Dockerfile
        run: docker build --check apps/api

  phase25-source-artifacts:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API runtime
        run: pip install -e .
      - name: Fetch current official/provider source artifacts
        run: |
          set -euo pipefail
          mkdir -p phase25-artifacts
          NSE_PRIMARY='https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv'
          NSE_FALLBACK='https://archives.nseindia.com/content/equities/EQUITY_L.csv'
          if curl --http1.1 --fail --location --retry 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0 IndiaAIFinancialAnalyst/0.7' \
            --output phase25-artifacts/EQUITY_L.csv "$NSE_PRIMARY"; then
            echo "$NSE_PRIMARY" > phase25-artifacts/nse-source-url.txt
          else
            curl --http1.1 --fail --location --retry 3 --retry-all-errors \
              --user-agent 'Mozilla/5.0 IndiaAIFinancialAnalyst/0.7' \
              --output phase25-artifacts/EQUITY_L.csv "$NSE_FALLBACK"
            echo "$NSE_FALLBACK" > phase25-artifacts/nse-source-url.txt
          fi
          curl --http1.1 --fail --location --retry 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0 IndiaAIFinancialAnalyst/0.7' \
            --output phase25-artifacts/NSE.json.gz \
            https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz
          curl --http1.1 --fail --location --retry 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0 IndiaAIFinancialAnalyst/0.7' \
            --output phase25-artifacts/ind_niftytotalmarket_list.csv \
            https://nsearchives.nseindia.com/content/indices/ind_niftytotalmarket_list.csv
      - name: Validate source artifacts and produce manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, hashlib, json
          from pathlib import Path

          root = Path('phase25-artifacts')
          equity = root / 'EQUITY_L.csv'
          rows = list(csv.DictReader(equity.open(encoding='utf-8-sig', newline='')))
          eq = [r for r in rows if str(r.get(' SERIES') or r.get('SERIES') or '').strip().upper() == 'EQ']
          if len(eq) < 1000:
              raise SystemExit(f'Official NSE EQ rows below production threshold: {len(eq)}')
          raw = gzip.decompress((root / 'NSE.json.gz').read_bytes())
          payload = json.loads(raw.decode('utf-8-sig'))
          if isinstance(payload, dict):
              payload = payload.get('data')
          if not isinstance(payload, list):
              raise SystemExit('Upstox NSE artifact is not a JSON array')
          up_eq = [
              x for x in payload if isinstance(x, dict)
              and str(x.get('segment') or '').upper() == 'NSE_EQ'
              and str(x.get('exchange') or '').upper() == 'NSE'
              and str(x.get('instrument_type') or '').upper() == 'EQ'
              and x.get('isin') and x.get('instrument_key')
          ]
          if len(up_eq) < 1000:
              raise SystemExit(f'Upstox NSE_EQ rows below production threshold: {len(up_eq)}')
          by_isin = {str(x['isin']).strip().upper(): x for x in up_eq}
          missing = []
          mismatches = []
          for row in eq:
              isin = str(row.get(' ISIN NUMBER') or row.get('ISIN NUMBER') or '').strip().upper()
              symbol = str(row.get('SYMBOL') or '').strip().upper()
              mapped = by_isin.get(isin)
              if not mapped:
                  missing.append(symbol)
                  continue
              up_symbol = str(mapped.get('trading_symbol') or '').strip().upper()
              if up_symbol != symbol or str(mapped.get('instrument_key') or '') != f'NSE_EQ|{isin}':
                  mismatches.append({'isin': isin, 'nse_symbol': symbol, 'upstox_symbol': up_symbol, 'instrument_key': mapped.get('instrument_key')})
          if missing or mismatches:
              raise SystemExit(f'Upstox exact mapping validation failed: missing={len(missing)} mismatches={len(mismatches)}')
          manifest = {
              'nse_source_url': (root / 'nse-source-url.txt').read_text(encoding='utf-8').strip(),
              'nse_total_rows': len(rows),
              'nse_eq_rows': len(eq),
              'nse_sha256': hashlib.sha256(equity.read_bytes()).hexdigest(),
              'upstox_source_url': 'https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz',
              'upstox_nse_eq_rows': len(up_eq),
              'upstox_sha256': hashlib.sha256((root / 'NSE.json.gz').read_bytes()).hexdigest(),
              'upstox_exact_isin_matches': len(eq),
              'upstox_missing': 0,
              'upstox_symbol_mismatches': 0,
              'synthetic_fallback': False,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Validate official NSE sector-classification subset
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path('phase25-artifacts')
          canonical_rows = list(
              csv.DictReader(
                  (root / 'EQUITY_L.csv').open(encoding='utf-8-sig', newline='')
              )
          )
          canonical = {}
          for row in canonical_rows:
              if str(row.get(' SERIES') or row.get('SERIES') or '').strip().upper() != 'EQ':
                  continue
              symbol = str(row.get('SYMBOL') or '').strip().upper()
              isin = str(
                  row.get(' ISIN NUMBER') or row.get('ISIN NUMBER') or ''
              ).strip().upper()
              if symbol and isin:
                  canonical[isin] = symbol

          source_path = root / 'ind_niftytotalmarket_list.csv'
          source_rows = list(
              csv.DictReader(source_path.open(encoding='utf-8-sig', newline=''))
          )
          eq_rows = []
          matched = []
          unmatched = []
          for row in source_rows:
              if str(row.get('Series') or '').strip().upper() != 'EQ':
                  continue
              item = {
                  'symbol': str(row.get('Symbol') or '').strip().upper(),
                  'isin': str(row.get('ISIN Code') or '').strip().upper(),
                  'sector': str(row.get('Industry') or '').strip(),
              }
              if not all(item.values()):
                  raise SystemExit('Official NIFTY Total Market row is incomplete')
              eq_rows.append(item)
              if canonical.get(item['isin']) == item['symbol']:
                  matched.append({
                      **item,
                      'source_uri': (
                          'https://nsearchives.nseindia.com/content/indices/'
                          'ind_niftytotalmarket_list.csv'
                      ),
                  })
              else:
                  unmatched.append(item)

          if len(eq_rows) < 700:
              raise SystemExit(
                  f'Official classification subset below safety floor: {len(eq_rows)}'
              )
          if len(matched) < 700:
              raise SystemExit(
                  f'Exact NSE symbol+ISIN classification matches below safety floor: {len(matched)}'
              )

          payload = {
              'taxonomy': 'NSE_INDICES_4_TIER',
              'classification_level': 'sector_only',
              'source_reported_field': 'Industry',
              'source_url': (
                  'https://nsearchives.nseindia.com/content/indices/'
                  'ind_niftytotalmarket_list.csv'
              ),
              'source_sha256': hashlib.sha256(source_path.read_bytes()).hexdigest(),
              'canonical_nse_sha256': hashlib.sha256(
                  (root / 'EQUITY_L.csv').read_bytes()
              ).hexdigest(),
              'source_eq_rows': len(eq_rows),
              'exact_symbol_isin_matches': len(matched),
              'unmatched_count': len(unmatched),
              'unmatched': unmatched,
              'full_four_tier_complete': False,
              'production_ready': False,
              'synthetic_fallback': False,
              'results': matched,
          }
          raw = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode('utf-8')
          (root / 'nse-sector-classification-subset.json').write_bytes(raw)
          manifest = {key: value for key, value in payload.items() if key != 'results'}
          (root / 'nse-sector-classification-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Upload Phase 25 source artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase25-source-artifacts-${{ github.run_id }}
          path: apps/api/phase25-artifacts/
          if-no-files-found: error
          retention-days: 3

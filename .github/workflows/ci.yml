name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API + live market worker runtime
        run: pip install -e ".[dev,live_market]"
      - name: Ruff
        run: ruff check app tests scripts
      - name: Typecheck
        run: mypy app --ignore-missing-imports --explicit-package-bases
      - name: Tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: |
          touch .env
          docker compose -f deploy/docker-compose.production.yml config >/dev/null
      - name: Validate API Dockerfile
        run: docker build --check apps/api

  phase25-live-nse-universe:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: production
      FREE_ONLY: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API runtime
        run: pip install -e .
      - name: Guard production database secret
        run: |
          set -euo pipefail
          [[ -n "${DATABASE_URL:-}" ]] || { echo "DATABASE_URL production secret is missing."; exit 2; }
      - name: Import official NSE EQ security master
        run: |
          set -euo pipefail
          python scripts/import_nse_security_master.py \
            --url https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv \
            --series EQ \
            --min-rows 1000 \
            | tee phase25-nse-universe-result.json
      - name: Verify live NSE EQ universe
        run: |
          set -euo pipefail
          python scripts/run_production_corpus_manifest.py --min-nse-eq-securities 1000 \
            > phase25-corpus-manifest.json || true
          cat phase25-corpus-manifest.json
      - name: Upload Phase 25 universe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase25-nse-universe-${{ github.run_id }}
          path: |
            apps/api/phase25-nse-universe-result.json
            apps/api/phase25-corpus-manifest.json
          if-no-files-found: ignore
          retention-days: 14

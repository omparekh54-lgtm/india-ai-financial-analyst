name: Official NSE delivery EOD inputs

on:
  push:
    branches: [main]
    paths: [.github/run-markers/official-delivery-inputs]

permissions:
  contents: read

concurrency:
  group: free-tier-production-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP_ENV: production
      FREE_ONLY: "true"
      ENABLE_EXTERNAL_DATA_CALLS: "true"
      ENABLE_EXTERNAL_LLM_CALLS: "false"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Validate reviewed import request
        run: |
          test -n "${DATABASE_URL:-}"
          grep -Fxq 'scope: prepared-50-official-delivery-inputs' ../../.github/run-markers/official-delivery-inputs
          mkdir -p delivery-results
      - name: Install existing API runtime
        run: pip install -e .
      - name: Validate and import the official daily report
        run: |
          set -euo pipefail
          session=$(sed -n 's/^session: //p' ../../.github/run-markers/official-delivery-inputs)
          python scripts/collect_official_peer_inputs.py --session "$session" --report full-delivery --dry-run \
            | tee delivery-results/validation.jsonl
          python scripts/collect_official_peer_inputs.py --session "$session" --report full-delivery --skip-readiness-refresh \
            | tee delivery-results/import.jsonl
      - name: Save compact import evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-delivery-inputs-${{ github.run_id }}
          path: apps/api/delivery-results/
          retention-days: 1
          if-no-files-found: warn
